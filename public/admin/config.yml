# Decap CMS — bilingual EN / 中文 fields
#
# Save flow (Save / Publish in editor):
#   → commits only to branch `cms` (draft staging)
#   → does NOT update production (`main`)
#
# Publish All (toolbar button):
#   → merges `cms` → `main` once via Netlify Function
#   → triggers ONE production deploy (~15 credits)
#
# Local test: set local_backend: true and run `npm run cms`
# Production (Netlify): must be false

local_backend: false

backend:
  name: git-gateway
  branch: cms

media_folder: public/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: projects
    label: Projects / 项目
    label_singular: Project / 项目
    folder: content/projects
    create: true
    delete: true
    slug: '{{slug}}'
    extension: json
    format: json
    identifier_field: slug
    summary: '{{nameEn}} · {{cityEn}}'
    fields:
      - label: Slug
        name: slug
        widget: string
        hint: 'URL id, e.g. mira-flats'
      - label: ID
        name: id
        widget: string
        hint: 'Usually same as slug'
      - label: Name (English)
        name: nameEn
        widget: string
      - label: 名称（中文）
        name: nameZh
        widget: string
        required: false
      - label: City (English)
        name: cityEn
        widget: string
      - label: 城市（中文）
        name: cityZh
        widget: string
        required: false
      - label: Type / 类型
        name: type
        widget: select
        options:
          - { label: Condo / 公寓, value: condo }
          - { label: Single-Family / 独栋, value: sfh }
          - { label: Townhouse / 联排, value: townhouse }
          - { label: Office / 办公, value: office }
          - { label: Mixed Residential / 混合住宅, value: mixed }
      - label: Status / 状态
        name: status
        widget: select
        options:
          - { label: Completed / 已完成, value: completed }
          - { label: In Progress / 进行中, value: in-progress }
          - { label: Acquired / 已收购, value: acquired }
          - { label: Sold / 已出售, value: sold }
      - label: Cover image / 封面图
        name: image
        widget: image
        choose_url: true
      - label: Short summary (English)
        name: summaryEn
        widget: text
      - label: 短摘要（中文）
        name: summaryZh
        widget: text
        required: false
      - label: Full description (English)
        name: bodyEn
        widget: markdown
        required: false
      - label: 完整描述（中文）
        name: bodyZh
        widget: markdown
        required: false
      - label: Description font / 正文字体
        name: bodyFont
        widget: select
        default: body
        options:
          - { label: Body · Figtree, value: body }
          - { label: Display · Syne, value: display }
          - { label: Serif · Cormorant, value: serif }
          - { label: 中文黑体 · Noto Sans SC, value: sans-sc }
          - { label: 中文宋体 · Noto Serif SC, value: serif-sc }
      - label: Highlights (English)
        name: highlightsEn
        widget: list
        allow_add: true
        required: false
      - label: 亮点（中文）
        name: highlightsZh
        widget: list
        allow_add: true
        required: false
      - { label: Year / 年份, name: year, widget: number, value_type: int }
      - { label: Units / 单元数, name: units, widget: number, value_type: int, required: false }
      - { label: Buildings / 栋数, name: buildings, widget: number, value_type: int, required: false }
      - { label: Sale value ($M) / 售价（百万美元）, name: saleValueM, widget: number, value_type: float, required: false }
      - { label: Acquisition ($M) / 收购价（百万美元）, name: acquisitionPriceM, widget: number, value_type: float, required: false }
      - { label: Latitude / 纬度, name: lat, widget: number, value_type: float }
      - { label: Longitude / 经度, name: lng, widget: number, value_type: float }
      - { label: Related entity / 关联主体, name: relatedEntity, widget: string, required: false }
      - { label: Featured on homepage / 首页推荐, name: featured, widget: boolean, default: false }
      - { label: Published / 已发布, name: published, widget: boolean, default: true }

  - name: pages
    label: Pages / 页面
    files:
      - name: home
        label: Homepage / 首页
        file: content/home.json
        fields:
          - { label: Hero eyebrow (EN), name: heroEyebrowEn, widget: string, hint: 'Use {year} for founded year' }
          - { label: 英雄眉标（中文）, name: heroEyebrowZh, widget: string, required: false }
          - { label: Founded year / 创立年份, name: foundedYear, widget: number, value_type: int }
          - { label: Brand left (EN), name: brandLeftEn, widget: string }
          - { label: Brand left（中文）, name: brandLeftZh, widget: string, required: false }
          - { label: Brand right (EN), name: brandRightEn, widget: string }
          - { label: Brand right（中文）, name: brandRightZh, widget: string, required: false }
          - { label: Hero lead (EN), name: heroLeadEn, widget: text }
          - { label: 英雄导语（中文）, name: heroLeadZh, widget: text, required: false }
          - { label: CTA primary (EN), name: heroCtaProjectsEn, widget: string }
          - { label: CTA primary（中文）, name: heroCtaProjectsZh, widget: string, required: false }
          - { label: CTA primary URL, name: heroCtaProjectsHref, widget: string }
          - { label: CTA secondary (EN), name: heroCtaAboutEn, widget: string }
          - { label: CTA secondary（中文）, name: heroCtaAboutZh, widget: string, required: false }
          - { label: CTA secondary URL, name: heroCtaAboutHref, widget: string }
          - label: Hero slides / 首页轮播
            name: heroSlides
            widget: list
            summary: '{{altEn}}'
            fields:
              - { label: Image, name: src, widget: image, choose_url: true }
              - { label: Alt (EN), name: altEn, widget: string }
              - { label: Alt（中文）, name: altZh, widget: string, required: false }
          - { label: Who eyebrow (EN), name: whoEyebrowEn, widget: string }
          - { label: Who eyebrow（中文）, name: whoEyebrowZh, widget: string, required: false }
          - { label: Who title (EN), name: whoTitleEn, widget: string }
          - { label: Who title（中文）, name: whoTitleZh, widget: string, required: false }
          - { label: Who lead (EN), name: whoLeadEn, widget: text }
          - { label: Who lead（中文）, name: whoLeadZh, widget: text, required: false }
          - { label: Vision (EN), name: visionEn, widget: text }
          - { label: Vision（中文）, name: visionZh, widget: text, required: false }
          - { label: Stat listings value, name: statListingsValue, widget: string, required: false, hint: 'Leave blank to use live project count +' }
          - { label: Stat listings label (EN), name: statListingsLabelEn, widget: string }
          - { label: Stat listings label（中文）, name: statListingsLabelZh, widget: string, required: false }
          - { label: Stat sales value, name: statSalesValue, widget: string }
          - { label: Stat sales label (EN), name: statSalesLabelEn, widget: string }
          - { label: Stat sales label（中文）, name: statSalesLabelZh, widget: string, required: false }
          - { label: Stat cities value, name: statCitiesValue, widget: string }
          - { label: Stat cities label (EN), name: statCitiesLabelEn, widget: string }
          - { label: Stat cities label（中文）, name: statCitiesLabelZh, widget: string, required: false }
          - { label: Stat note (EN), name: statNoteEn, widget: text }
          - { label: Stat note（中文）, name: statNoteZh, widget: text, required: false }
          - { label: Spotlight image, name: spotlightImage, widget: image, choose_url: true }
          - { label: Spotlight alt (EN), name: spotlightAltEn, widget: string }
          - { label: Spotlight alt（中文）, name: spotlightAltZh, widget: string, required: false }
          - { label: Spotlight eyebrow (EN), name: spotlightEyebrowEn, widget: string }
          - { label: Spotlight eyebrow（中文）, name: spotlightEyebrowZh, widget: string, required: false }
          - { label: Spotlight title (EN), name: spotlightTitleEn, widget: string }
          - { label: Spotlight title（中文）, name: spotlightTitleZh, widget: string, required: false }
          - { label: Spotlight body (EN), name: spotlightBodyEn, widget: text }
          - { label: Spotlight body（中文）, name: spotlightBodyZh, widget: text, required: false }
          - { label: Spotlight CTA (EN), name: spotlightCtaEn, widget: string }
          - { label: Spotlight CTA（中文）, name: spotlightCtaZh, widget: string, required: false }
          - { label: Spotlight CTA URL, name: spotlightCtaHref, widget: string }
          - { label: Selected title (EN), name: selectedTitleEn, widget: string }
          - { label: Selected title（中文）, name: selectedTitleZh, widget: string, required: false }
          - { label: All projects link (EN), name: allProjectsEn, widget: string }
          - { label: All projects link（中文）, name: allProjectsZh, widget: string, required: false }
          - { label: Featured count / 首页推荐数量, name: featuredCount, widget: number, value_type: int, default: 3 }
